name: Update and publish Zastal calendar

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/update-calendar.yml'

permissions:
  contents: read

concurrency:
  group: zastal-calendar-publication
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit tests (offline fixtures)
        run: python -m pytest -q
      - name: Fetch both sources and generate calendar
        run: python -m src.main --report reports/latest.json
      - name: Validate saved iCalendar
        run: python -m src.validate docs/zastal.ics
      - name: Commit only a changed calendar
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/zastal.ics
          if git diff --cached --quiet; then
            echo 'Calendar unchanged; no commit.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update Zastal subscribed calendar'
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      - name: Save audit report
        uses: actions/upload-artifact@v4
        with:
          name: calendar-audit
          path: reports/latest.json
          retention-days: 14
      - name: Upload static Pages files
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Explicit deploy is essential: a GITHUB_TOKEN commit does not build Pages.
      # Deploy even without a new commit, so a failed previous deploy can recover.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Repair calendar integrity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zastal-calendar-publication
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Rebuild from official data with integrity repair enabled
        run: python -m src.main --repair-integrity --report reports/latest.json
      - name: Validate repaired calendar
        run: python -m src.validate docs/zastal.ics
      - name: Commit repaired calendar
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/zastal.ics
          if git diff --cached --quiet; then
            echo 'Calendar already valid and up to date; no commit.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Repair Zastal calendar integrity preserving event UIDs'
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      - name: Upload repaired calendar to Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

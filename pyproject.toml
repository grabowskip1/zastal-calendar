[project]
name = 'zastal-calendar'
version = '1.0.0'
description = 'Subscribed iCalendar feed for Zastal Zielona Góra'
requires-python = '>=3.12'

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '-ra'

[tool.ruff]
line-length = 110
target-version = 'py312'

[tool.ruff.format]
quote-style = 'single'
